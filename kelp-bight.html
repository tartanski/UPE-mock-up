<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kelp Bight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --paper:#dde3e0;
    --surface:#eceeec;
    --surface-2:#e0e4e1;
    --surface-3:#cfd6d1;
    --ink-900:#1c2422;
    --ink-700:#3d4744;
    --ink-500:#5f6a66;
    --ink-400:#7c8783;
    --line:#b9c2bc;
    --line-strong:#9aa69f;
    --moss:#4c6b58;
    --moss-strong:#37503f;
    --moss-soft:#dbe4dc;
    --rain:#516777;
    --rain-strong:#3a4c58;
    --rain-soft:#dde4e8;
    --wood:#7a5f45;
    --wood-strong:#5c4732;
    --wood-soft:#e8ded1;
    --warn:#a06a2e;
    --warn-soft:#ecdec7;
    --bad:#8a4438;
    --bad-soft:#e9d5cf;
    --good:#3f6d4c;
    --good-soft:#d9e5da;
    --shadow:0 1px 2px rgba(20,26,23,.08), 0 8px 22px -12px rgba(20,26,23,.28);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#12181a; --surface:#182120; --surface-2:#1d2725; --surface-3:#26332f;
      --ink-900:#e7ece8; --ink-700:#bcc6c0; --ink-500:#8b9793; --ink-400:#6b7773;
      --line:#2c3835; --line-strong:#3d4b46;
      --moss:#7fa889; --moss-strong:#9cc2a5; --moss-soft:#203025;
      --rain:#8fa7b8; --rain-strong:#aec2cf; --rain-soft:#1c2830;
      --wood:#b3947a; --wood-strong:#cbae90; --wood-soft:#2c241b;
      --warn:#d0a25e; --warn-soft:#302510;
      --bad:#d18b7c; --bad-soft:#301f1a;
      --good:#8fc39d; --good-soft:#17271c;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.6);
    }
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--paper); color:var(--ink-900);
    font-family:'Source Serif 4', Georgia, serif;
    background-image:
      repeating-linear-gradient(115deg, rgba(0,0,0,0.012) 0px, rgba(0,0,0,0.012) 1px, transparent 1px, transparent 6px);
  }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--line-strong); border-radius:4px; }
  .card{ background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow); }
  .btn{
    font-family:'IBM Plex Mono', monospace; font-size:12.5px; letter-spacing:.02em;
    border:1px solid var(--line-strong); background:var(--surface-2); color:var(--ink-900);
    padding:7px 10px; text-align:left; transition:background .12s,border-color .12s;
  }
  .btn:hover:not(:disabled){ background:var(--surface-3); border-color:var(--moss); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-accent{ background:var(--moss-soft); border-color:var(--moss); color:var(--moss-strong); font-weight:600; }
  .btn-accent:hover:not(:disabled){ background:var(--moss); color:var(--surface); }
  .pip{ width:9px; height:9px; border-radius:1px; display:inline-block; }
  .fade-in{ animation:fadeIn .3s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(2px);} to{opacity:1; transform:none;} }
  .rain-anim{
    background-image: repeating-linear-gradient(100deg, transparent 0 8px, rgba(90,110,120,.10) 8px 9px);
    animation: rainmove 1.4s linear infinite;
  }
  @keyframes rainmove{ from{ background-position:0 0; } to{ background-position:-60px 60px; } }

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const round1 = v => Math.round(v * 10) / 10;
const round2 = v => Math.round(v * 100) / 100;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const randInt = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
function curveValue(cfg, t) {
  switch (cfg.type) {
    case "peak":
      return cfg.base + cfg.amp * Math.exp(-Math.pow((t - cfg.peak) / cfg.width, 2));
    case "ramp":
      return cfg.start + cfg.slope * t;
    case "ramp_wave":
      return cfg.start + cfg.slope * t + cfg.waveAmp * Math.sin(t * cfg.waveFreq);
    case "wave":
      return cfg.base + cfg.waveAmp * Math.sin(t * cfg.waveFreq);
    default:
      return 0.6;
  }
}
function npcPressure(npcId, day) {
  const t = day / BALANCE.totalDays;
  const cfg = BALANCE.npcCurves[npcId];
  return clamp(curveValue(cfg, t), BALANCE.pressureClamp[0], BALANCE.pressureClamp[1]);
}
function standingTier(v) {
  if (v >= BALANCE.standing.highThreshold) return "high";
  if (v >= BALANCE.standing.warmThreshold) return "warm";
  if (v >= 0) return "neutral";
  return "low";
}
function tierLabel(t) {
  return {
    low: "distant",
    neutral: "even",
    warm: "warm",
    high: "close"
  }[t];
}
function rollWeather(day) {
  const t = (day - 1) / (BALANCE.totalDays - 1);
  const shift = BALANCE.weather.lateSeasonShift * t;
  const odds = {
    ...BALANCE.weather.baseOdds
  };
  odds.clear = Math.max(0.03, odds.clear - shift * 0.5);
  odds.rain = Math.max(0.12, odds.rain - shift * 0.35);
  odds.heavy_rain = odds.heavy_rain + shift * 0.45;
  odds.storm = odds.storm + shift * 0.4;
  const total = odds.clear + odds.rain + odds.heavy_rain + odds.storm;
  let r = Math.random() * total,
    acc = 0;
  for (const k of ["clear", "rain", "heavy_rain", "storm"]) {
    acc += odds[k];
    if (r <= acc) return k;
  }
  return "rain";
}
function askCost(npcId, day, standing, discountMult) {
  const pressure = npcPressure(npcId, day);
  const standingFactor = 1 + Math.max(0, standing) * BALANCE.standing.standingFactorPerPoint;
  const lowPenalty = standing < 0 ? 1 - standing * BALANCE.standing.lowStandingPenaltyPerPoint : 1;
  let cost = BALANCE.standing.baseAskCost * pressure * lowPenalty / standingFactor;
  if (discountMult) cost *= discountMult;
  return round2(Math.max(0.15, cost));
}
function attemptAsk(npcId, day, standing, discountMult) {
  const cost = askCost(npcId, day, standing, discountMult);
  const refusal = clamp(cost * BALANCE.standing.refusalCostMultiplier, BALANCE.standing.refusalMin, BALANCE.standing.refusalMax);
  const refused = Math.random() < refusal;
  return {
    cost,
    refused,
    pressure: npcPressure(npcId, day)
  };
}
function proteinTotal(preserved) {
  const p = BALANCE.winter.proteinPerUnit;
  return preserved.deer * p.deer + preserved.salmon * p.salmon + preserved.halibut * p.halibut + preserved.crab * p.crab;
}

function pushLog(state, text, kind) {
  const entry = {
    day: state.day,
    slot: state.slot,
    text,

  return {

}
function adjustStanding(state, npcId, delta) {
  const npcs = {
    ...state.npcs
  };
  const cur = npcs[npcId];
  const next = clamp(round2(cur.standing + delta), BALANCE.standing.min, BALANCE.standing.max);
  npcs[npcId] = {
    ...cur,
    standing: next
  };
  return {
    ...state,
    npcs
  };
}
function spreadTransitive(state, sourceId, amount) {
  const npc = NPC_MAP[sourceId];
  const others = npc.closeTo.length ? npc.closeTo : NPCS.filter(n => n.id !== sourceId).map(n => n.id);
  const targets = others.slice(0, BALANCE.standing.transitiveTargets);
  let s = state;
  const heard = [];
  targets.forEach(id => {
    s = adjustStanding(s, id, amount);
    heard.push(NPC_MAP[id].name);
  });
  if (heard.length && amount > 0.05) {
    s = pushLog(s, `Word travels in Kelp Bight — ${heard.join(" and ")} heard about it.`, "gossip");
  }
  return s;
}
function markSkillUsed(state, skillId) {
  return {
    ...state,
    player: {
      ...state.player,
      skillLastUsed: {

        [skillId]: state.day

}
function raiseSkill(state, skillId, toLevel) {
  const cur = state.player.skills[skillId];
  const capped = Math.min(toLevel, BALANCE.skills.maxLevel);
  if (capped <= cur) return state;
  const skills = {
    ...state.player.skills,
    [skillId]: capped
  };
  const skillTaughtLevel = {
    ...state.player.skillTaughtLevel,
    [skillId]: Math.max(state.player.skillTaughtLevel[skillId], capped)
  };
  const skillLastUsed = {
    ...state.player.skillLastUsed,
    [skillId]: state.day
  };
  return {
    ...state,
    player: {
      ...state.player,
      skills,
      skillTaughtLevel,
      skillLastUsed
    }
  };
}
function weatherOk(state, allowed) {
  return allowed.includes(state.weather);
}

/* ---- daily maintenance: rust, spoilage, water, gifts, crisis check ---- */
function runDailyMaintenance(state) {
  let s = state;
  const p = s.player;
  let skills = {
    ...p.skills
  };
  let lastUsed = {
    ...p.skillLastUsed
  };
  SKILLS.forEach(sk => {
    const taught = p.skillTaughtLevel[sk.id];
    if (taught <= 0) return;
    const floor = Math.max(0, taught - BALANCE.skills.rustFloorOffset);
    if (skills[sk.id] > floor && s.day - lastUsed[sk.id] > BALANCE.skills.rustDays) {
      skills[sk.id] -= 1;
      lastUsed[sk.id] = s.day;
      s = pushLog(s, `You're out of practice at ${sk.label ? sk.label : SKILL_LABEL[sk.id]}. It's slipped a level.`, "rust");
    }
  });
  s = {
    ...s,
    player: {
      ...s.player,
      skills,
      skillLastUsed: lastUsed
    }
  };
  const fresh = s.inventory.freshFood;
  const totalFresh = freshFoodTotal(fresh);
  if (totalFresh > 0.05) {
    const frac = BALANCE.spoilage.dailyFraction;
    const nf = {
      deer: round2(fresh.deer * (1 - frac)),
      salmon: round2(fresh.salmon * (1 - frac)),
      halibut: round2(fresh.halibut * (1 - frac)),
      crab: round2(fresh.crab * (1 - frac))
    };
    const lost = round2(totalFresh - freshFoodTotal(nf));
    s = {
      ...s,
      inventory: {
        ...s.inventory,
        freshFood: nf
      }
    };
    if (lost > 0.4) s = pushLog(s, `Some fresh catch spoiled before you could preserve it (−${lost}).`, "warn");
  }

  // The water system is communal: the player has no direct lever on it at all.
  // It drifts toward a ceiling set by how embedded the player is with the settlement
  // as a whole (average standing) — the only way to help it is through people, never alone.
  const w = s.village.water;
  const avgStanding = NPCS.reduce((sum, npc) => sum + s.npcs[npc.id].standing, 0) / NPCS.length;
  const cap = clamp(BALANCE.waterSystem.passiveCapBase + avgStanding * BALANCE.waterSystem.passiveCapPerStanding, BALANCE.waterSystem.passiveCapMin, BALANCE.waterSystem.passiveCapMax);
  if (w < cap) {
    const gain = round1(w + randInt(...BALANCE.waterSystem.passiveRegen.map(x => x * 10)) / 10);
    s = {
      ...s,
      village: {
        ...s.village,
        water: Math.min(cap, gain)
      }
    };
  }
  NPCS.forEach(npc => {
    const rec = s.npcs[npc.id];
    const tier = standingTier(rec.standing);
    const chance = tier === "high" ? BALANCE.standing.giftChanceHigh : tier === "warm" ? BALANCE.standing.giftChanceWarm : 0;
    if (chance > 0 && Math.random() < chance && s.day - rec.lastGiftDay > 2) {
      s = grantGift(s, npc.id);
    }
  });
  if (s.pendingCrisis && s.pendingCrisis.day === s.day) {
    s = resolveCrisis(s, s.pendingCrisis);
    s = {
      ...s,
      pendingCrisis: null
    };
  }
  s = processFavorDeadlines(s);
  s = maybeSpawnFavorRequests(s);
  return s;
}

/* ---- two-way favors: NPCs asking the player for something concrete ---- */
function setFavorStatus(state, id, status) {
  return {
    ...state,
    favors: {
      requests: state.favors.requests.map(r => r.id === id ? {
        ...r,
        status
      } : r)
    }
  };
}
function itemAmount(state, kind) {
  if (kind === "firewoodCords") return state.inventory.firewoodCords;
  if (kind === "lumber") return state.inventory.lumber;
  if (kind === "preservedFood") return Object.values(state.inventory.preservedFood).reduce((a, b) => a + b, 0);
  return 0;
}
function deductItem(state, kind, qty) {
  if (kind === "firewoodCords") return {
    ...state,
    inventory: {
      ...state.inventory,
      firewoodCords: round2(state.inventory.firewoodCords - qty)
    }
  };
  if (kind === "lumber") return {
    ...state,
    inventory: {
      ...state.inventory,
      lumber: round1(state.inventory.lumber - qty)
    }
  };
  if (kind === "preservedFood") {
    const pf = state.inventory.preservedFood;
    const total = Object.values(pf).reduce((a, b) => a + b, 0);
    const ratio = total > 0 ? Math.max(0, (total - qty) / total) : 0;
    const npf = {};
    Object.keys(pf).forEach(k => {
      npf[k] = round2(pf[k] * ratio);
    });
    return {
      ...state,
      inventory: {
        ...state.inventory,
        preservedFood: npf
      }
    };
  }
  return state;
}
const ITEM_LABEL = {
  firewoodCords: "firewood (cords)",
  lumber: "lumber",
  preservedFood: "preserved food"
};
function processFavorDeadlines(state) {
  let s = state;
  s.favors.requests.filter(r => (r.status === "pending" || r.status === "accepted") && r.deadlineDay < s.day).forEach(r => {
    s = adjustStanding(s, r.npcId, -BALANCE.favors.ignoreStandingHit);
    s = pushLog(s, `You never got back to ${NPC_MAP[r.npcId].name} about it. They noticed.`, "refusal");
    s = setFavorStatus(s, r.id, "expired");
  });
  return s;
}
function maybeSpawnFavorRequests(state) {
  let s = state;
  NPCS.forEach(npc => {
    const pendingCount = s.favors.requests.filter(r => r.status === "pending" || r.status === "accepted").length;
    if (pendingCount >= BALANCE.favors.maxPending) return;
    if (s.favors.requests.some(r => r.npcId === npc.id && (r.status === "pending" || r.status === "accepted"))) return;
    const pressure = npcPressure(npc.id, s.day);
    const chance = BALANCE.favors.spawnChancePerNpcPerDay * (1 + pressure * BALANCE.favors.spawnPressureWeight);
    if (Math.random() < chance) s = spawnFavorRequest(s, npc.id);
  });
  return s;
}
function spawnFavorRequest(state, npcId) {
  const npc = NPC_MAP[npcId];
  const kind = pick(BALANCE.favors.itemKindsByNpc[npcId]);
  const deadlineDay = Math.min(state.day + randInt(BALANCE.favors.deadlineDaysMin, BALANCE.favors.deadlineDaysMax), BALANCE.totalDays);
  const req = {
    id: `${npcId}-${state.day}-${Math.random().toString(36).slice(2, 7)}`,
    npcId,
    kind,
    createdDay: state.day,
    deadlineDay,
    status: "pending"
  };
  if (kind === "labor") {
    req.flavor = pick(FAVOR_LABOR_FLAVOR[npcId]);
  } else {
    req.qty = kind === "firewoodCords" ? round1(0.6 + Math.random() * 0.8) : round1(1 + Math.random() * 1.5);
    req.flavor = `${npc.name} asks if you can spare ${req.qty} ${ITEM_LABEL[kind]}.`;
  }
  return {
    ...state,
    favors: {
      requests: [...state.favors.requests, req]
    }
  };
}
function respondFavor(state, requestId, response) {
  const req = state.favors.requests.find(r => r.id === requestId);
  if (!req || req.status !== "pending") return state;
  const npc = NPC_MAP[req.npcId];
  let s = state;
  if (response === "decline") {
    s = adjustStanding(s, req.npcId, -BALANCE.favors.declineStandingHit);
    s = pushLog(s, `You tell ${npc.name} you can't help with that right now. Fair enough — but it's noted.`, "refusal");
    s = setFavorStatus(s, requestId, "declined");
    return s;
  }
  if (req.kind === "labor") {
    s = pushLog(s, `You tell ${npc.name} you'll make time for it before the deadline.`, "favor");
    s = setFavorStatus(s, requestId, "accepted");
    return s;
  }
  const have = itemAmount(s, req.kind);
  if (have < req.qty) {
    s = pushLog(s, `You'd like to help ${npc.name}, but you don't have enough ${ITEM_LABEL[req.kind]} to spare right now.`, "warn");
    return s;
  }
  s = deductItem(s, req.kind, req.qty);
  s = adjustStanding(s, req.npcId, BALANCE.favors.itemRewardStanding);
  s = spreadTransitive(s, req.npcId, BALANCE.favors.itemRewardStanding * BALANCE.standing.transitiveFraction);
  s = pushLog(s, `You send ${npc.name} what they needed. They won't forget it.`, "favor");
  s = setFavorStatus(s, requestId, "fulfilled");
  return s;
}

function triggerStormDamage(state) {
  let s = state;
  if (Math.random() >= BALANCE.weather.stormDamageChance) return s;
  const options = ["roof", "stove", "water", "boatLine"];
  const kind = pick(options);
  const [lo, hi] = BALANCE.weather.stormDamage[kind];
  const amt = randInt(lo, hi);
  if (kind === "roof") {
    s = {
      ...s,
      shelter: {
        ...s.shelter,
        roof: Math.max(0, s.shelter.roof - amt)
      }
    };
    s = pushLog(s, `The storm tears at the roof — damage taken (−${amt}).`, "storm");
    s = {
      ...s,
      pendingCrisis: {
        day: s.day + 1,
        kind: "roof"
      }
    };
  } else if (kind === "stove") {

      shelter: {

        stove: Math.max(0, s.shelter.stove - amt)
      }
    };

    s = {
      ...s,
      pendingCrisis: {
        day: s.day + 1,
        kind: "stove"
      }
    };

      }
    };

  } else {
    s = pushLog(s, `A boat line frays badly in the wind. It'll need a fix.`, "storm");
    s = {
      ...s,
      pendingCrisis: {
        day: s.day + 1,
        kind: "boatLine"
      }
    };
  }
  return s;
}
function resolveCrisis(state, crisis) {
  const candidates = {
    roof: ["dutch", "hollis"],
    stove: ["renne"],
    boatLine: ["marek", "renne"]
  }[crisis.kind] || [];
  let best = null;
  candidates.forEach(id => {
    const st = state.npcs[id].standing;
    if (standingTier(st) === "high" && (!best || st > state.npcs[best].standing)) best = id;
  });
  if (!best) return state;
  const npc = NPC_MAP[best];
  let s = state;
  if (crisis.kind === "roof") s = {
    ...s,
    shelter: {
      ...s.shelter,
      roof: Math.min(100, s.shelter.roof + 45)
    }
  };
  if (crisis.kind === "stove") s = {
    ...s,
    shelter: {
      ...s.shelter,
      stove: Math.min(100, s.shelter.stove + 45)
    }
  };
  s = pushLog(s, `${npc.name} shows up the next morning with what's needed, and fixes it without being asked. Nothing is said about it.`, "crisis");
  return s;
}
function advanceSlot(state) {
  let s = state;
  if (s.slot < 2) {
    s = {
      ...s,
      slot: s.slot + 1
    };
    return s;
  }
  const nextDay = s.day + 1;
  if (nextDay > BALANCE.totalDays) {
    return {
      ...s,
      phase: "winter_score",
      day: nextDay
    };
  }
  const w = rollWeather(nextDay);
  s = {
    ...s,
    day: nextDay,
    slot: 0,
    weather: w
  };
  s = pushLog(s, `Day ${nextDay}, morning. ${WEATHER_INFO[w].desc}`, "weather");
  if (w === "storm") s = triggerStormDamage(s);
  s = runDailyMaintenance(s);
  return s;
}
function skipDays(state, n) {
  let s = state;
  for (let i = 0; i < n; i++) {
    const nextDay = s.day + 1;
    if (nextDay > BALANCE.totalDays) {
      s = {
        ...s,
        phase: "winter_score",
        day: nextDay
      };
      return s;
    }
    const w = rollWeather(nextDay);
    s = {
      ...s,
      day: nextDay,
      slot: 0,
      weather: w
    };
    if (w === "storm") s = triggerStormDamage(s);
    s = runDailyMaintenance(s);
  }
  return s;
}
